---
# This task will copy files or filled out templates to the host for the docker containers
# Input: docker_file, one docker_configuration_files entry (or a
# docker_configuration_paths entry with src/dest set to a single file);
# see roles/docker/defaults/main.yaml for its keys

# Ensure the directory exists
# No mode is set so containers that manage their own config dir permissions
# (e.g. qbittorrent-vpn sets /config/wireguard to 0700) aren't reset every run
- name: Ensure the directory exists  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ docker_file.dest | dirname }}"
    state: directory

- name: Copy file
  ansible.builtin.copy:
    src: "{{ docker_file.src }}"
    dest: "{{ docker_file.dest }}"
    mode: "{{ docker_file.mode }}"
  when: not docker_file.src.endswith('.j2')
  register: docker_copy_results
  notify: Restart docker container

- name: Process template file
  ansible.builtin.template:
    src: "{{ docker_file.src }}"
    dest: "{{ docker_file.dest | regex_replace('\\.j2$', '') }}"
    mode: "{{ docker_file.mode }}"
  when: docker_file.src.endswith('.j2')
  register: docker_template_results
  notify: Restart docker container

# Collect changed container names
- name: Collect changed container names
  ansible.builtin.set_fact:
    docker_containers_to_restart: "{{ docker_containers_to_restart + [docker_file.container_name] }}"
  when:
    - docker_copy_results.changed or docker_template_results.changed
    - docker_file.restart | default(true)
  changed_when: false
