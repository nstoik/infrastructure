---
# file to install nvidia docker toolkit

# block for nvidia docker toolkit tasks if nvidia gpu support is enabled
- name: Install nvidia docker toolkit
  tags:
    - docker
  when: docker_config_nvidia_gpu | bool
  block:
    # Add NVidia container toolkit GPG key
    - name: Add NVIDIA container toolkit GPG key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: "{{ docker_nvidia_apt_keyring_path }}"
        mode: "0644"
      become: true

    # The key used to be dearmored to a .gpg keyring and the .asc deleted,
    # which re-downloaded the key (a change) on every run. apt reads armored
    # keys directly, so the .asc is kept and the old repo line and .gpg removed.
    # TODO: remove these two migration tasks once all GPU hosts have converged.
    - name: Remove old NVIDIA container toolkit repository line
      ansible.builtin.apt_repository:
        repo: >
          deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg]
          https://nvidia.github.io/libnvidia-container/stable/deb/amd64 /
        filename: nvidia-container-toolkit
        state: absent
        update_cache: false
      become: true

    - name: Remove old binary NVIDIA GPG keyring
      ansible.builtin.file:
        path: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
        state: absent
      become: true

    # Add NVidia container toolkit repository
    - name: Add NVIDIA container toolkit repository
      ansible.builtin.apt_repository:
        repo: >
          deb [signed-by={{ docker_nvidia_apt_keyring_path }}]
          https://nvidia.github.io/libnvidia-container/stable/deb/amd64 /
        filename: nvidia-container-toolkit
        state: present
      become: true

    # install nvidia docker toolkit
    - name: Install NVIDIA container toolkit
      ansible.builtin.apt:
        pkg:
          - nvidia-container-toolkit
        state: present
        cache_valid_time: 120
      notify: Restart docker
      become: true
